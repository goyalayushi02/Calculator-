<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="container">
   
    <div id="screen"></div>
    <table>
      <tr>
        <td><button class="button" id="add">+</button></td>
        <td><button class="button" id="sub">-</button></td>    
     
                <td><button class="button" id="mul">×</button></td>
                <td><button class="button" id="div">÷</button></td>
      </tr>
      <tr>
                <td><button class="button">1</button></td>
                <td><button class="button">2</button></td>
     
                <td><button class="button">3</button></td>
            <td><button class="button">4</button></td>
      </tr>
      <tr>
                <td><button class="button">5</button></td>
                <td><button class="button">6</button></td>
      
      
       
                <td><button class="button">7</button></td>
                <td><button class="button">8</button></td>
      </tr> 
      <tr>
                <td><button class="button">9</button></td>
                <td><button class="button">0</button></td>
     
      
      
                <td><button class="button" id="ac">AC</button></td>
                <td><button class="button" id="delete">⌫</button></td>
      </tr>
      <tr>
        
                <td><button class="button">%</button></td>
                <td><button class="button">00</button></td>
              <td><button class="button">.</button></td>
                <td><button class="button" id="equal">=</button></td>
      </tr>
      
    </table>
    
    
  </div>
  <script src="script.js"></script>
</body>
</html>
